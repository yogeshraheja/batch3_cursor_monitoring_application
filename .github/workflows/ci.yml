name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy CI-only values — never real secrets or SSH keys.
      APP_ENV: demo
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      ADMIN_PASSWORD: CiTestAdminPassw0rd!
      LOGIN_FAILURE_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
